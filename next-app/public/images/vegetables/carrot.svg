<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="carrotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="carrotLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background circle badge -->
  <rect width="400" height="400" rx="40" fill="#0f172a" />
  <circle cx="200" cy="200" r="160" fill="#1e293b" stroke="#f97316" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Feathery Green Foliage Tops -->
  <g id="foliage" filter="url(#shadow)">
    <!-- Central stalk -->
    <path d="M 200 150 C 200 100, 200 40, 200 30 C 205 60, 215 90, 200 150" fill="url(#carrotLeaf)" />
    <!-- Left fronds -->
    <path d="M 195 140 C 170 100, 140 60, 120 50 C 135 75, 160 110, 195 140" fill="url(#carrotLeaf)" />
    <path d="M 195 120 C 160 90, 125 75, 100 70 C 120 90, 150 110, 195 120" fill="url(#carrotLeaf)" />
    <!-- Right fronds -->
    <path d="M 205 140 C 230 100, 260 60, 280 50 C 265 75, 240 110, 205 140" fill="url(#carrotLeaf)" />
    <path d="M 205 120 C 240 90, 275 75, 300 70 C 280 90, 250 110, 205 120" fill="url(#carrotLeaf)" />
  </g>

  <!-- Orange Conical Carrot Root -->
  <g id="root" filter="url(#shadow)">
    <path d="M 160 150 C 160 142, 240 142, 240 150 C 242 190, 220 280, 203 360 C 201 366, 199 366, 197 360 C 180 280, 158 190, 160 150 Z" fill="url(#carrotBody)" />
    <!-- Horizontal characteristic soil ridges -->
    <path d="M 175 180 Q 200 185 225 180" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 170 215 Q 195 220 220 215" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 180 255 Q 200 260 218 255" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 185 295 Q 200 300 212 295" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 192 330 Q 200 334 207 330" stroke="#c2410c" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
    <!-- Glossy highlight reflection -->
    <path d="M 175 160 C 172 190, 180 260, 192 340" stroke="#fdba74" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>
  <text x="200" y="385" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f97316" text-anchor="middle">CARROT • DAUCUS CAROTA</text>
</svg>